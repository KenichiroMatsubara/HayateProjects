[package]
name = "houou-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Houou の wasm 束ね — Web の ShogiEngine プラグインが読む入口"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
houou-core = { path = "../houou-core" }
wasm-bindgen = "0.2.126"
js-sys = "0.3.103"
console_error_panic_hook = "0.1.7"

# wasm-opt（binaryen）を回さない。CI で binaryen の取得・実行に依存させないため
# （Hayate scripts/build-wasm.sh と同方針）。release の opt-level だけで十分小さい。
[package.metadata.wasm-pack.profile.release]
wasm-opt = false
